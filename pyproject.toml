[project]
name = "hermes-mcp"
version = "0.1.0"
description = "MCP server that lets any AI agent drive a local Hermes Agent install - sessions, cron jobs, config, skills and gateway."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Woonyong Choi" }]
keywords = ["mcp", "model-context-protocol", "hermes", "hermes-agent", "nous-research", "agent", "automation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "mcp>=1.2.0",
  "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/woonyong-choi/hermes-mcp"
Issues = "https://github.com/woonyong-choi/hermes-mcp/issues"

[project.scripts]
hermes-mcp = "hermes_mcp.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
