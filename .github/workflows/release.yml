name: release

# Publishes to PyPI with Trusted Publishing (no API token stored in GitHub).
# One-time setup on PyPI: Add a pending publisher for project "hermes-mcp",
# owner "woonyong-choi", repository "hermes-mcp", workflow "release.yml",
# environment "pypi". Then push a tag like v0.1.0.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
